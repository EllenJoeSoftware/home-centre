name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]          # path filters are not evaluated for tag pushes
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write         # needed to create GitHub Releases on v* tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      # Optional release signing secrets. When ANDROID_KEYSTORE_BASE64 is not set, release APKs
      # are signed with the runner's (ephemeral) debug keystore so they are still installable.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      HC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      HC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      HC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      HC_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "HC_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "HC_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Release APKs will be signed with the provided keystore."

      - name: Note debug-key signing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 not set - release APKs are signed with the debug keystore."

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:testDebugUnitTest \
            :mobile:assembleDebug :tv:assembleDebug \
            :mobile:assembleRelease :tv:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/release/mobile-release.apk dist/home-centre-mobile.apk
          cp tv/build/outputs/apk/release/tv-release.apk dist/home-centre-tv.apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/home-centre-mobile-debug.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk dist/home-centre-tv-debug.apk
          ls -la dist

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: android/core/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: home-centre-mobile.apk
          path: android/dist/home-centre-mobile.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: home-centre-tv.apk
          path: android/dist/home-centre-tv.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: home-centre-debug-apks
          path: android/dist/*-debug.apk

      # The iOS workflow attaches its IPA to the same tag's release, possibly at the same time:
      # create the release only if missing (tolerating a concurrent create), then upload.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            || { sleep 10; gh release view "$TAG" >/dev/null; }
          gh release upload "$TAG" dist/home-centre-mobile.apk dist/home-centre-tv.apk --clobber
