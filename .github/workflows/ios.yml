name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]          # path filters are not evaluated for tag pushes, so every v* tag builds
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write         # needed to attach the IPA to a GitHub Release on v* tags

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode 16
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1)"
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Runner images ship simulator runtimes for several Xcodes; only runtimes <= the selected
          # Xcode's iOS Simulator SDK version are usable by it.
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: $SDK_VERSION"
          UDID="$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c '
          import json, os, re, sys
          sdk = tuple(int(x) for x in (os.environ["SDK_VERSION"].split(".") + ["0"])[:2])
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if version > sdk:
                  continue
              for d in devices:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')"
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeCentre.xcodeproj \
            -scheme HomeCentre \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            | tee "$RUNNER_TEMP/test.log" | grep -E "(error|warning: .*HomeCentre|Test Case|Executed|TEST (SUCCEEDED|FAILED))" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log" || { tail -n 200 "$RUNNER_TEMP/test.log"; exit 1; }

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HomeCentre-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HomeCentre.xcodeproj \
            -scheme HomeCentre \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HomeCentre.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "(error|ARCHIVE (SUCCEEDED|FAILED))" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { tail -n 200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/HomeCentre.xcarchive/Products/Applications/HomeCentre.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/HomeCentre-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/HomeCentre-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCentre-unsigned-ipa
          path: HomeCentre-unsigned.ipa
          if-no-files-found: error

      # The Android workflow attaches its APKs to the same tag's release, possibly at the same time:
      # create the release only if missing (tolerating a concurrent create), then upload.
      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            || { sleep 10; gh release view "$TAG" >/dev/null; }
          gh release upload "$TAG" "$GITHUB_WORKSPACE/HomeCentre-unsigned.ipa" --clobber

      # ----------------------------------------------------------------------------------------
      # OPTIONAL: signed IPA / TestFlight. Unsigned IPAs above can be sideloaded with
      # AltStore or Sideloadly (they re-sign with your Apple ID). For a properly signed build:
      #
      # 1. Add repository secrets:
