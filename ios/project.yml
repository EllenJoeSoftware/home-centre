# XcodeGen spec — run `xcodegen generate` in this directory to produce HomeCentre.xcodeproj
# (the .xcodeproj is generated, never checked in).
name: HomeCentre

options:
  bundleIdPrefix: com.ellenjoe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"  # Swift 5 language mode (compiled by the Swift 5.9+/6 toolchain in Xcode 15/16)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEAD_CODE_STRIPPING: YES

targets:
  HomeCentre:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HomeCentre
    info:
      # Generated by XcodeGen from the properties below (git-ignored).
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Home Centre
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Home servers are usually plain http:// on the LAN (or a bare IP), so allow it.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Home Centre connects to your media server on the local network to browse and stream your media.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenjoe.homecentre
        PRODUCT_NAME: HomeCentre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        # Set your Team ID here (or via -allowProvisioningUpdates/DEVELOPMENT_TEAM=...) to run on a device.
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - HomeCentreTests
      gatherCoverageData: true

  HomeCentreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HomeCentreTests
    dependencies:
      - target: HomeCentre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenjoe.homecentre.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
