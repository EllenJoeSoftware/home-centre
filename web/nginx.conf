# Rendered to /etc/nginx/conf.d/default.conf by the nginx image's envsubst
# template step. Only ${API_UPSTREAM} is substituted (NGINX_ENVSUBST_FILTER).

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/manifest+json image/svg+xml text/vtt application/vnd.apple.mpegurl;

server {
    # IPv4 only: "listen [::]:80" makes nginx exit at start-up on hosts with IPv6 disabled.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Media uploads are not part of the API, but keep bodies bounded.
    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API + media streaming proxy --------------------------------------
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Byte-range requests for seeking in video/audio.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Stream straight through; never spool media to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # Long-running streams and on-the-fly transcodes.
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        # Compressing media breaks ranges; upstream JSON is small anyway.
        gzip off;
    }

    # ---- Static assets ----------------------------------------------------
    # Vite emits content-hashed file names: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
